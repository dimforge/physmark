[package]
name = "physmark-rapier"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
rapier3d-mjcf = { path = "../../.physmark/sources/rapier/crates/rapier3d-mjcf" }
physmark-core = { path = "../../crates/physmark-core" }
rapier3d = { path = "../../.physmark/sources/rapier/crates/rapier3d" }
anyhow = "1"
serde_json = "1"
rayon = "1"
[features]
# Robot scenes run a second build without it (see main.rs).
default = ["parallel"]
parallel = ["rapier3d/parallel"]
[profile.release]
lto = "thin"
