[package]
name = "physmark-nexus"
version = "0.1.0"
edition = "2024"
[workspace]
[features]
default = ["metal"]
metal = ["nexus3d/metal", "khal/metal"]
webgpu = ["nexus3d/webgpu", "khal/webgpu"]
cpu = ["nexus3d/cpu", "khal/cpu"]
cuda = ["nexus3d/cuda", "khal/cuda"]
[dependencies]
rapier3d-mjcf = { path = "../../.physmark/sources/rapier/crates/rapier3d-mjcf" }
physmark-core = { path = "../../crates/physmark-core" }
nexus3d = { path = "../../.physmark/sources/nexus/crates/nexus3d", default-features = false, features = ["dim3", "f32", "rbd", "mpm"] }
khal = "0.4"
anyhow = "1"
serde_json = "1"
pollster = "0.4"
[patch.crates-io]
rapier3d = { path = "../../.physmark/sources/rapier/crates/rapier3d" }
khal = { git = "https://github.com/dimforge/khal", rev = "57ad7b6badd5bbdaa59462de282847abe8080912" }
khal-derive = { git = "https://github.com/dimforge/khal", rev = "57ad7b6badd5bbdaa59462de282847abe8080912" }
khal-std = { git = "https://github.com/dimforge/khal", rev = "57ad7b6badd5bbdaa59462de282847abe8080912" }
khal-builder = { git = "https://github.com/dimforge/khal", rev = "57ad7b6badd5bbdaa59462de282847abe8080912" }
vortx = { git = "https://github.com/dimforge/vortx", rev = "e7b9add21702a2656d7c39dbd848d33157e51b17" }
vortx-shaders = { git = "https://github.com/dimforge/vortx", rev = "e7b9add21702a2656d7c39dbd848d33157e51b17" }
[profile.release]
lto = "thin"
