[workspace]
members = ["crates/physmark-core", "crates/physmark"]
exclude = ["adapters/rapier", "adapters/nexus", ".physmark"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
[profile.release]
lto = "thin"
